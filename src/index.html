<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>TASTE — Engage in Art</title>

		<!-- Normalize -->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
		/>

		<!-- Green Audio Player -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/greghub/green-audio-player/dist/css/green-audio-player.min.css"
		/>
		<script
			defer
			src="https://cdn.jsdelivr.net/gh/greghub/green-audio-player/dist/js/green-audio-player.min.js"
		></script>

		<link rel="stylesheet" href="./styles.css" />
	</head>

	<body>
		<!-- ===== HERO ===== -->
		<header
			class="hero"
			style="--hero: url('http://localhost:3131/images/background.jpg')"
		>
			<div class="hero__overlay">
				<h1 class="logo">TASTE</h1>
				<p class="logo__tag">ENGAGE<br />IN<br />ART</p>
			</div>
		</header>

		<!-- ===== NAVIGATION ===== -->
		<nav class="nav">
			<a href="#/home" data-upper>Home</a>
			<a href="#/search" data-upper>Search</a>
			<a href="#/discover" data-upper>Discover</a>
		</nav>

		<!-- ===== MAIN VIEW (dynamically replaced by JS) ===== -->
		<main id="view">
			<!-- === Subscribe section (visible on the home page) === -->
			<section id="subscribe">
				<h3 class="title" data-upper>Subscribe now</h3>

				<div class="banner">
					<!-- Small gray cover with caption -->
					<figure class="artist">
						<img
							src="http://localhost:3131/images/artist-gray.jpg"
							alt="New album cover"
						/>
						<figcaption class="artist__caption" data-upper>
							New album — available only for subscribers
						</figcaption>
					</figure>

					<!-- Text and button -->
					<p class="copy-main">
						<span class="name-dean" data-upper>Dean</span><br />
						<span class="name-hen" data-upper>Hen</span
						><span class="name-son red" data-upper>son</span>
					</p>

					<div class="copy-sub">
						<div class="copy-sub-title" data-upper>New album</div>
						<div class="copy-sub-text" data-upper>
							Available only for subscribers
						</div>
					</div>

					<!-- CTA link -->
					<a class="cta" href="/join-now" data-upper>Join now</a>
				</div>
			</section>
		</main>

		<!-- ===== FOOTER ===== -->
		<footer class="footer" >All right reserved</footer>

		<!-- ===== JS ===== -->
		<script type="module" src="./js/app.js"></script>

		<!-- ===== Uppercase converter (client requires via JS) ===== -->
		<script>
			function applyUppercase(scope = document) {
				scope.querySelectorAll('[data-upper]').forEach((el) => {
					el.textContent = el.textContent.toUpperCase();
				});
			}

			document.addEventListener('DOMContentLoaded', () => applyUppercase());
		</script>
	</body>
</html>
